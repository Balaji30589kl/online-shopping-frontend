# GitHub Actions workflow to build and push the frontend Docker image to Docker Hub
# Required GitHub Secrets:
# - DOCKERHUB_USERNAME: Your Docker Hub username (e.g., balaji30589)
# - DOCKERHUB_TOKEN: A Docker Hub access token or password

name: Build and Push Frontend Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: |
            balaji30589/online-shopping-frontend:latest
            balaji30589/online-shopping-frontend:${{ steps.vars.outputs.sha_short }}
          provenance: false
